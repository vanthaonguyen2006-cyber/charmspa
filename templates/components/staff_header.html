<!-- =========================================
     STAFF HEADER - MONTSERRAT FONT
     Thay toàn bộ Header cũ bằng đoạn này
========================================= -->

<style>

    /* Header đầy đủ chiều ngang, giảm chiều cao */
    .staff-header {
        position: sticky;
        top: 0;
        z-index: 30;

        width: 100% !important;
        max-width: none !important;

        height: 64px !important;
        min-height: 64px !important;

        margin: 0;
        padding: 0 20px !important;

        box-sizing: border-box;

        display: flex;
        align-items: center;
        justify-content: space-between;

        gap: 16px;

        background: #fffefa;
        border: 1px solid #eae5dc;
        border-radius: 0 0 12px 12px;

        /* Font chính của toàn bộ Header */
        font-family: 'Montserrat', Arial, sans-serif;
    }


    /* =========================================
       PHẦN CHÀO MỪNG
    ========================================= */

    .staff-header .header-welcome {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
    }

    /* Tiêu đề chính */
    .staff-header .header-welcome-title {
        font: 700 16px 'Montserrat', Arial, sans-serif;
        letter-spacing: .4px;
        color: #292724;
    }

    /* Dòng mô tả */
    .staff-header .header-welcome-subtitle {
        font: 400 12px 'Montserrat', Arial, sans-serif;
        color: #9a8c7e;
    }


    /* =========================================
       KHU VỰC NGÀY GIỜ BÊN PHẢI
    ========================================= */

    .staff-header .header-right {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-left: auto;
        flex-shrink: 0;
    }

    /* Hộp thông tin ngày và giờ */
    .staff-header .header-info-box {
        display: flex;
        align-items: center;
        gap: 7px;

        padding: 5px 10px;

        background: #faf7f3;
        border: 1px solid #eadfd2;
        border-radius: 8px;

        white-space: nowrap;
    }

    /* Icon lịch và đồng hồ */
    .staff-header .header-info-box svg {
        width: 17px;
        height: 17px;

        color: #a48454;
        flex-shrink: 0;
    }

    /* Nội dung ngày giờ */
    .staff-header .header-info-text {
        display: flex;
        flex-direction: column;
        gap: 2px;
    }

    /* Giá trị ngày và giờ */
    .staff-header .header-info-text strong {
        font: 700 12px 'Montserrat', Arial, sans-serif;
        color: #37312c;
    }

    /* Chú thích ngày làm việc và giờ hiện tại */
    .staff-header .header-info-text small {
        font: 400 10px 'Montserrat', Arial, sans-serif;
        color: #9a8c7e;
    }


    /* =========================================
       RESPONSIVE - MÀN HÌNH NHỎ
    ========================================= */

    @media (max-width: 700px) {

        .staff-header {
            width: 100% !important;
            padding: 0 10px !important;
            gap: 8px;
        }

        .staff-header .header-welcome-title {
            font-size: 12px;
        }

        .staff-header .header-welcome-subtitle {
            display: none;
        }

        .staff-header .header-right {
            gap: 5px;
        }

        .staff-header .header-info-box {
            padding: 6px;
            gap: 5px;
        }

        .staff-header .header-info-box svg {
            width: 14px;
            height: 14px;
        }

        .staff-header .header-info-text strong {
            font-size: 10px;
        }

        .staff-header .header-info-text small {
            display: none;
        }
    }


    /* =========================================
       RESPONSIVE - ĐIỆN THOẠI NHỎ
    ========================================= */

    @media (max-width: 420px) {

        .staff-header .header-welcome-title {
            font-size: 10px;
        }

        .staff-header .header-info-box svg {
            display: none;
        }
    }

</style>


<!-- =========================================
     HEADER HTML
========================================= -->

<header class="staff-header">

    <!-- Tiêu đề khu vực làm việc -->
    <div class="header-welcome">

        <div class="header-welcome-title">
            KHÔNG GIAN LÀM VIỆC
        </div>

        <div class="header-welcome-subtitle">
            Nơi mỗi trải nghiệm được chăm chút.
        </div>

    </div>


    <!-- Khu vực hiển thị ngày và giờ -->
    <div class="header-right">

        <!-- Ngày hiện tại -->
        <div class="header-info-box">

            <i data-lucide="calendar-days"></i>

            <div class="header-info-text">
                <strong id="staffCurrentDate">--/--/----</strong>
                <small>Ngày làm việc</small>
            </div>

        </div>


        <!-- Giờ hiện tại -->
        <div class="header-info-box">

            <i data-lucide="clock-3"></i>

            <div class="header-info-text">
                <strong id="staffCurrentTime">--:--:--</strong>
                <small>Giờ hiện tại</small>
            </div>

        </div>

    </div>

</header>


<!-- =========================================
     JAVASCRIPT - CẬP NHẬT NGÀY GIỜ
========================================= -->

<script>

    // Chỉ giữ một bản script cập nhật ngày giờ trong staff_base.html.
    function updateStaffDateTime() {

        const now = new Date();

        // Lấy phần tử hiển thị ngày và giờ.
        const dateElement = document.getElementById('staffCurrentDate');
        const timeElement = document.getElementById('staffCurrentTime');

        // Cập nhật ngày theo định dạng Việt Nam.
        if (dateElement) {

            dateElement.textContent = now.toLocaleDateString('vi-VN', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric'
            });

        }

        // Cập nhật giờ theo định dạng 24 giờ.
        if (timeElement) {

            timeElement.textContent = now.toLocaleTimeString('vi-VN', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });

        }

    }

    // Hiển thị ngày giờ ngay khi tải trang.
    updateStaffDateTime();

    // Tự động cập nhật đồng hồ mỗi giây.
    setInterval(updateStaffDateTime, 1000);

</script>
